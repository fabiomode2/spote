# nginx delante de spoted. Copia a /etc/nginx/conf.d/spote.conf y ajusta
# dominio, certificados y, si hace falta, el puerto.
#
# Este fichero se incluye dentro de `http`, así que los `map` y `limit_*` de
# arriba son válidos. spoted escucha en 127.0.0.1:7070; nunca lo expongas
# directamente a Internet.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 0 = pasa; 1 = falta la clave. Se deja pasar el preflight OPTIONS para que
# un cliente web con CORS pueda pedir la clave al navegador; spoted sigue
# cerrando la API a cualquier petición real sin clave.
map "$request_method:$http_x_spote_key" $spote_deny {
    default          1;
    "~^OPTIONS:"     0;
    "~^[A-Z]+:.+"    0;
}

limit_req_zone $binary_remote_addr zone=spote_api:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=spote_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name spote.example.com;

    return 301 https://$host$request_uri;
}

server {
    # `http2` en el listen funciona en nginx de Debian/Ubuntu y en versiones
    # nuevas (que avisan del parámetro antiguo, pero lo aceptan).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name spote.example.com;

    ssl_certificate     /etc/letsencrypt/live/spote.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/spote.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    client_max_body_size 1m;
    limit_conn spote_conn 20;

    # Latido para Docker/uptime. No devuelve datos.
    location = /healthz {
        proxy_pass http://127.0.0.1:7070;
        proxy_set_header Host $host;
        access_log off;
    }

    location /api/ {
        # Doble puerta: nginx corta aquí y spoted vuelve a comprobarlo. Quitar
        # este bloque no abre la API, pero evita tráfico inútil. OPTIONS pasa
        # sin clave para que el preflight CORS funcione; el CORS de spoted
        # solo acepta el origen configurado.
        if ($spote_deny) {
            return 401;
        }

        limit_req zone=spote_api burst=40 nodelay;

        proxy_pass http://127.0.0.1:7070;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Spote-Key $http_x_spote_key;

        # WebSocket /api/v1/ws
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    location / {
        return 404;
    }
}
