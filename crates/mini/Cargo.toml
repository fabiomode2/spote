[package]
name = "spote-mini"
version.workspace = true
edition.workspace = true
license.workspace = true
# eframe 0.32 exige 1.85; el workspace declara 1.82 pero el toolchain real es 1.100.
rust-version = "1.85"

[dependencies]
spote-protocol = { path = "../protocol" }
eframe = { version = "0.32.3", default-features = false, features = ["glow", "x11", "wayland", "default_fonts"] }
image = { workspace = true }
