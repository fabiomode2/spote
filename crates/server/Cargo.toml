[package]
name = "spote-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "spoted: backend social de spote (axum + SQLite + WebSocket)"

[[bin]]
name = "spoted"
path = "src/main.rs"

[dependencies]
spote-protocol = { path = "../protocol" }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
rusqlite = { workspace = true }
rand = { workspace = true }
sha2 = "0.10"
subtle = "2"
hex = "0.4"
axum = { version = "0.8", features = ["ws"] }
tower-http = { workspace = true, features = ["cors", "limit", "set-header", "trace"] }
futures-util = "0.3"
libc = "0.2"
qrcode = { workspace = true }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = { version = "0.30", features = ["connect", "handshake"] }
