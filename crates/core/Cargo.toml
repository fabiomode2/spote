[package]
name = "spote-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["desktop"]
# zbus/MPRIS solo existe en Linux/escritorio. El cliente Android compila el
# core con `default-features = false`.
desktop = ["dep:zbus"]

[dependencies]
spote-protocol = { path = "../protocol" }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
rusqlite = { workspace = true }
image = { workspace = true }
rustfft = { workspace = true }
uuid = { workspace = true }
dirs = { workspace = true }
toml = { workspace = true }
rand = { workspace = true }
zbus = { workspace = true, optional = true }
sha1 = "0.10"
percent-encoding = "2"
# En Android aws-lc-rs puede petar con páginas de 16 KB; ring es el proveedor
# criptográfico que usamos en todas las plataformas para el catálogo.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

# En Android no hay inicialización de rustls-platform-verifier (necesita el
# Context/JVM); usamos las raíces webpki empaquetadas para que reqwest no
# intente el verificador del sistema.
[target.'cfg(target_os = "android")'.dependencies]
webpki-root-certs = "1"
