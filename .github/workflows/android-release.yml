name: Android release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versión sin la v inicial (por ejemplo 0.2.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: APK arm64
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolver versión
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="${INPUT_VERSION:-}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          VERSION="${VERSION#v}"

          if ! [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Versión no válida: '$VERSION'. Usa el formato X.Y.Z."
            exit 1
          fi

          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          VERSION_CODE=$((10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH))

          if [ "$VERSION_CODE" -lt 1 ] || [ "$VERSION_CODE" -gt 2100000000 ]; then
            echo "::error::versionCode fuera de rango: $VERSION_CODE"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Compilando spote $VERSION (versionCode $VERSION_CODE)"

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar plataforma y NDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Instalar Rust stable y target Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache de Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Instalar cargo-ndk
        run: cargo install cargo-ndk --locked

      # El script compila la .so con cargo-ndk y genera/copia los bindings de
      # uniffi al source set de Android. El bindgen se ejecuta desde el propio
      # proyecto (bin de uniffi), no hace falta instalarlo globalmente.
      - name: Compilar librería nativa y bindings Kotlin
        run: bash ./scripts/build-android-lib.sh

      - name: Preparar keystore de release
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          [ -n "${KEYSTORE_BASE64:-}" ] || missing=1
          [ -n "${KEYSTORE_PASSWORD:-}" ] || missing=1
          [ -n "${KEY_ALIAS:-}" ] || missing=1
          [ -n "${KEY_PASSWORD:-}" ] || missing=1

          if [ "$missing" -ne 0 ]; then
            if [ "${{ github.event_name }}" = "push" ]; then
              echo "::error::Faltan secretos de firma (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD)."
              exit 1
            fi
            echo "::warning::Sin keystore completo; el APK de workflow_dispatch quedará sin firmar."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/spote-release.keystore"
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "Keystore preparado en \$RUNNER_TEMP/spote-release.keystore"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.8"

      - name: Compilar APK release
        working-directory: android
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          GRADLE_ARGS=(
            ":app:assembleRelease"
            "--no-daemon"
            "-PspoteVersionName=$VERSION"
            "-PspoteVersionCode=$VERSION_CODE"
          )
          if [ "${{ steps.keystore.outputs.available }}" = "true" ]; then
            GRADLE_ARGS+=(
              "-PspoteKeystore=$RUNNER_TEMP/spote-release.keystore"
              "-PspoteKeystorePassword=${ANDROID_KEYSTORE_PASSWORD:-}"
              "-PspoteKeyAlias=${ANDROID_KEY_ALIAS:-}"
              "-PspoteKeyPassword=${ANDROID_KEY_PASSWORD:-}"
            )
          fi
          if [ -x ./gradlew ]; then
            ./gradlew "${GRADLE_ARGS[@]}"
          else
            gradle "${GRADLE_ARGS[@]}"
          fi

      - name: Renombrar APK
        id: apk
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          APK_DIR="android/app/build/outputs/apk/release"
          mapfile -t APKS < <(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' | sort)
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "::error::No se generó ningún APK en $APK_DIR"
            exit 1
          fi

          APK=""
          for candidate in "${APKS[@]}"; do
            case "$candidate" in
              *-unsigned.apk) ;;
              *) APK="$candidate"; break ;;
            esac
          done
          if [ -z "$APK" ]; then
            APK="${APKS[0]}"
          fi

          mkdir -p dist
          ASSET="dist/spote-${VERSION}-arm64-v8a.apk"
          cp "$APK" "$ASSET"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          echo "APK: $ASSET"
          echo "SHA-256: $(sha256sum "$ASSET" | awk '{print $1}')"
          ls -lh "$ASSET"

      - name: Publicar release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: spote ${{ steps.version.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          fail_on_unmatched_files: true
          files: ${{ steps.apk.outputs.asset }}

      - name: Subir APK como artefacto
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: spote-${{ steps.version.outputs.version }}-arm64-v8a
          path: ${{ steps.apk.outputs.asset }}
          if-no-files-found: error
          retention-days: 14
