name: spote

services:
  spoted:
    build:
      context: .
      dockerfile: Dockerfile
    image: spote-spoted:local
    container_name: spoted
    restart: unless-stopped
    stop_grace_period: 15s
    env_file:
      - .env
    environment:
      SPOTE_BIND: 0.0.0.0:7070
      SPOTE_DB: /data/spote-server.db
      RUST_LOG: info,spote_server=info,tower_http=warn
    # Solo nginx (en el host) puede hablar con el backend. No publiques 7070.
    ports:
      - "127.0.0.1:7070:7070"
    volumes:
      - spote-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7070/healthz"]
      interval: 30s
      timeout: 4s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  spote-data:
    name: spote-data
